version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    dir: frontend
    sources:
      - package.json
      - pnpm-lock.yaml
    generates:
      - node_modules/*
    preconditions:
      - sh: pnpm --version
        msg: "Looks like pnpm isn't installed. Install it with: npm install -g pnpm"
    cmds:
      - pnpm install

  build:frontend:
    label: build:frontend (PRODUCTION={{.PRODUCTION}})
    summary: Build the frontend project
    cmds:
      - task: '{{if eq .PRODUCTION "true"}}build:frontend:production{{else}}build:frontend:dev{{end}}'
        vars:
          BINDING_FLAGS:
            ref: .BINDING_FLAGS

  build:frontend:dev:
    label: build:frontend:dev
    internal: true
    dir: frontend
    sources:
      - "bindings/**/*"
      - "public/**/*"
      - "src/**/*"
      - "index.html"
      - "package.json"
      - "pnpm-lock.yaml"
      - "postcss.config.js"
      - "tsconfig.json"
      - "tsconfig.node.json"
      - "vite.config.ts"
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BINDING_FLAGS:
            ref: .BINDING_FLAGS
    cmds:
      - pnpm -quiet run build:dev
    env:
      PRODUCTION: "false"

  build:frontend:production:
    label: build:frontend:production
    internal: true
    dir: frontend
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BINDING_FLAGS:
            ref: .BINDING_FLAGS
    cmds:
      - pnpm -quiet run build
    env:
      PRODUCTION: "true"


  build:server:
    summary: Builds portico-server (backend + embedded Web UI); pure Go, cross-compiles without cgo
    deps:
      - task: build:frontend
        vars:
          PRODUCTION: "true"
    cmds:
      - go build -trimpath -buildvcs=false -ldflags="-s -w" -o {{.OUTPUT}} ./cmd/portico-server
    vars:
      SERVER_GOOS: '{{.SERVER_GOOS | default OS}}'
      EXE_SUFFIX: '{{if eq .SERVER_GOOS "windows"}}.exe{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/portico-server{{.EXE_SUFFIX}}'
      OUTPUT: '{{.SERVER_OUTPUT | default .DEFAULT_OUTPUT}}'
    env:
      CGO_ENABLED: 0
      GOOS: '{{.SERVER_GOOS}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  generate:bindings:
    label: generate:bindings (BINDING_FLAGS={{.BINDING_FLAGS}})
    summary: Generates bindings for the frontend
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*  # Rerun when switching between dev/production mode causes changes in output
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    # facade 只在 cmd/bindgen 中登记（运行时由 portico-server 的 admin API 暴露）；
    # -names 生成按名称调用的 bindings，前端 HTTP transport 据此转发到 /api/rpc。
    # -tags server 让分析阶段不依赖 cgo / gtk。
    cmds:
      - wails3 generate bindings -f '-tags server {{.BINDING_FLAGS}}' -clean=true -names -ts ./cmd/bindgen

  generate:icons:
    summary: Generates Windows `.ico` and Mac `.icns` files from an image
    dir: build
    sources:
      - "appicon.png"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  dev:frontend:
    summary: Runs the frontend in development mode
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - pnpm run dev -- --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
