version: '3'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

# Optional machine-local overrides; this file is intentionally not committed.
dotenv: ['.env.local']

vars:
  APP_NAME: "Portico"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the desktop shell in development mode (it spawns bin/portico-server)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  build:server:
    summary: Builds the headless backend (portico-server, with embedded Web UI) for the current platform
    cmds:
      - task: common:build:server

  run:server:
    summary: Builds and runs portico-server in the foreground (configure via env, e.g. PORTICO_ADMIN_LISTEN=0.0.0.0:18101)
    deps:
      - build:server
    cmds:
      - '{{.BIN_DIR}}/portico-server serve'

