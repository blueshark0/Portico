  create-release:
    name: Create Release
    # needs: [build-linux, build-macos, build-windows]
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/linux-amd64/portico-linux-amd64.* release-assets/
          # cp artifacts/macos-arm64/portico-macos-arm64.zip release-assets/
          # cp artifacts/macos-amd64/portico-macos-amd64.zip release-assets/
          # cp artifacts/windows-amd64/Portico-amd64-installer.exe release-assets/
          # cp artifacts/windows-amd64/Portico.exe release-assets/
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          body: |
            ## 新增功能

            ### 优先级分组调度

            新增 Level 字段（1-10）用于供应商优先级分组，实现更灵活的降级策略。

            **主要改进**：
            - 后端：重构调度逻辑为两层循环架构，优先尝试高优先级分组
            - 前端：添加 Level 下拉选择器和可视化徽章（L1-L10）
            - 国际化：支持中英文 Level 描述文本
            - 测试：新增单元测试覆盖分组、排序和序列化逻辑

            **使用场景**：
            - 成本优化：低成本供应商优先，高成本作为备份
            - 稳定性保障：高质量供应商优先，社区供应商降级
            - 地域分组：国内供应商优先，国外供应商备份

            **向后兼容**：未设置 Level 的供应商自动默认为 Level 1。

            ## 安装说明

            以下均为 x86_64 Linux 构建，需要 GTK 4 和 WebKitGTK 6.0：

            - **Debian / Ubuntu**：下载 `portico-linux-amd64.deb`
            - **Fedora / RHEL**：下载 `portico-linux-amd64.rpm`
            - **Arch Linux**：下载 `portico-linux-amd64.pkg.tar.zst`
            - **其他发行版**：下载 `portico-linux-amd64.AppImage`
          # 恢复其他平台时，把下面几行移回上面的 body：
          # - **Windows**：下载 `Portico-amd64-installer.exe` 运行安装，或下载 `Portico.exe` 直接运行
          # - **macOS (Apple Silicon)**：下载 `portico-macos-arm64.zip`
          # - **macOS (Intel)**：下载 `portico-macos-amd64.zip`
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
