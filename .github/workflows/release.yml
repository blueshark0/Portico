name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        run: cd frontend && pnpm install

      - name: Update build assets
        run: wails3 task common:update:build-assets

      - name: Generate bindings
        run: wails3 task common:generate:bindings

      - name: Build macOS ${{ matrix.arch }}
        run: env ARCH=${{ matrix.arch }} wails3 task package

      - name: Find app bundle
        id: find-app
        run: |
          if [ -d "bin/portico.app" ]; then
            echo "app_path=bin/portico.app" >> $GITHUB_OUTPUT
          elif [ -d "bin/Portico.app" ]; then
            echo "app_path=bin/Portico.app" >> $GITHUB_OUTPUT
          else
            echo "App bundle not found" >&2
            exit 1
          fi

      - name: Archive macOS app
        run: |
          cd bin
          ditto -c -k --sequesterRsrc --keepParent "$(basename ${{ steps.find-app.outputs.app_path }})" portico-macos-${{ matrix.arch }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: bin/portico-macos-${{ matrix.arch }}.zip

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Install frontend dependencies
        run: cd frontend && pnpm install

      - name: Install NSIS
        run: choco install nsis -y

      - name: Update build assets
        run: wails3 task common:update:build-assets

      - name: Generate bindings
        run: wails3 task common:generate:bindings

      - name: Build Windows Binary
        run: |
          $env:ARCH = "amd64"
          wails3 task windows:build
        env:
          PRODUCTION: "true"

      - name: Verify Binaries
        run: |
          foreach ($binary in @("bin\Portico.exe", "bin\portico-server.exe")) {
            if (Test-Path $binary) {
              Write-Host "✓ Binary found: $binary"
              Get-Item $binary | Format-List Name,Length,LastWriteTime
            } else {
              Write-Host "✗ Binary not found: $binary"
              Write-Host "Listing bin directory:"
              Get-ChildItem bin -ErrorAction SilentlyContinue
              exit 1
            }
          }

      - name: Create NSIS Installer
        run: |
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          Push-Location build\windows\nsis
          wails3 generate webview2bootstrapper
          $binaryPath = (Resolve-Path "..\..\..\bin\Portico.exe").Path
          $serverPath = (Resolve-Path "..\..\..\bin\portico-server.exe").Path
          Write-Host "Binary path: $binaryPath"
          Write-Host "Server path: $serverPath"
          makensis -DARG_WAILS_AMD64_BINARY="$binaryPath" -DARG_PORTICO_SERVER_BINARY="$serverPath" project.nsi
          Pop-Location

      # 便携版：桌面壳从自身目录拉起 portico-server.exe，二者必须放在一起。
      - name: Create portable archive
        run: Compress-Archive -Path bin\Portico.exe, bin\portico-server.exe -DestinationPath bin\portico-windows-amd64-portable.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            bin/Portico-amd64-installer.exe
            bin/portico-windows-amd64-portable.zip

  build-server:
    name: Build portico-server (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # bindings 生成使用 -tags server，不需要 gtk / webkit；wails3 CLI 本身也可无 cgo 安装。
      - name: Install Wails
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Build Web UI
        run: |
          wails3 task common:generate:bindings
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build and archive
        run: |
          # 版本号取自 internal/shared/buildinfo（与桌面版一致；不一致会触发桌面版重启后端）。
          for arch in amd64 arm64; do
            dir="portico-server-linux-${arch}"
            mkdir -p "dist/${dir}"
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} go build -trimpath -buildvcs=false -ldflags="-s -w" \
              -o "dist/${dir}/portico-server" ./cmd/portico-server
            cp build/linux/systemd/portico-server.service LICENSE "dist/${dir}/"
            tar -C dist -czf "dist/${dir}.tar.gz" "${dir}"
          done
          ls -lh dist/*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: dist/*.tar.gz

  create-release:
    name: Create Release
    needs: [build-macos, build-windows, build-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/macos-arm64/portico-macos-arm64.zip release-assets/
          cp artifacts/macos-amd64/portico-macos-amd64.zip release-assets/
          cp artifacts/windows-amd64/Portico-amd64-installer.exe release-assets/
          cp artifacts/windows-amd64/portico-windows-amd64-portable.zip release-assets/
          cp artifacts/server-linux/*.tar.gz release-assets/
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release-assets/*
          body: |
            ## 新增功能

            ### 优先级分组调度

            新增 Level 字段（1-10）用于供应商优先级分组，实现更灵活的降级策略。

            **主要改进**：
            - 后端：重构调度逻辑为两层循环架构，优先尝试高优先级分组
            - 前端：添加 Level 下拉选择器和可视化徽章（L1-L10）
            - 国际化：支持中英文 Level 描述文本
            - 测试：新增单元测试覆盖分组、排序和序列化逻辑

            **使用场景**：
            - 成本优化：低成本供应商优先，高成本作为备份
            - 稳定性保障：高质量供应商优先，社区供应商降级
            - 地域分组：国内供应商优先，国外供应商备份

            **向后兼容**：未设置 Level 的供应商自动默认为 Level 1。

            ## 安装说明

            - **Windows**：下载 `Portico-amd64-installer.exe` 运行安装，或下载 `portico-windows-amd64-portable.zip` 解压后运行 `Portico.exe`（需与 `portico-server.exe` 放在同一目录）
            - **macOS (Apple Silicon)**：下载 `portico-macos-arm64.zip`
            - **macOS (Intel)**：下载 `portico-macos-amd64.zip`
            - **Linux 服务器（无桌面）**：下载 `portico-server-linux-<arch>.tar.gz`，运行 `portico-server`，浏览器访问管理界面（见 README「服务器部署」）
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
