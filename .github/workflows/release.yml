  create-release:
    name: Create Release
    # needs: [build-linux, build-macos, build-windows]
    needs: [build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp artifacts/linux-amd64/portico-linux-amd64.* release-assets/
          # cp artifacts/macos-arm64/portico-macos-arm64.zip release-assets/
          # cp artifacts/macos-amd64/portico-macos-amd64.zip release-assets/
          # cp artifacts/windows-amd64/Portico-amd64-installer.exe release-assets/
          # cp artifacts/windows-amd64/Portico.exe release-assets/
          ls -lh release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: RELEASE_NOTES.md
          # 首个版本先生成草稿，确认安装包可用后再手动发布
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
