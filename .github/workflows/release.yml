name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-24.04
    env:
      ARCH: amd64
      # nfpm.yaml 通过环境变量读取架构和维护者
      GOARCH: amd64
      GIT_COMMITTER_NAME: blueshark0
      GIT_COMMITTER_EMAIL: blueshark0@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      # nfpm.yaml 里的版本号是固定值，打包前改成当前 tag，否则 deb/rpm 无法正常升级
      - name: Set package version
        run: |
          sed -i "s/^version: .*/version: \"${GITHUB_REF_NAME#v}\"/" build/linux/nfpm/nfpm.yaml

      # AppImage 打包要从 GitHub 下载工具，偶尔会返回 504，失败后等一分钟重试
      - name: Build Linux packages
        run: |
          for attempt in 1 2 3; do
            wails3 task package && exit 0
            echo "Packaging attempt $attempt failed"
            sleep 60
          done
          exit 1

      - name: Rename packages
        run: |
          cd bin
          mv ./*.AppImage portico-linux-amd64.AppImage
          mv Portico.deb portico-linux-amd64.deb
          mv Portico.rpm portico-linux-amd64.rpm
          mv Portico.pkg.tar.zst portico-linux-amd64.pkg.tar.zst

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: bin/portico-linux-amd64.*

  build-server:
    name: Build portico-server (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # bindings 生成使用 -tags server，不需要 gtk / webkit；wails3 CLI 本身也可无 cgo 安装。
      - name: Install Wails
        run: CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Build Web UI
        run: |
          wails3 task common:generate:bindings
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build and archive
        run: |
          # 版本号取自 internal/shared/buildinfo（与桌面版一致；不一致会触发桌面版重启后端）。
          # 当前发布优先 x86_64，恢复 arm64 时把它加回下面的列表
          for arch in amd64; do
            dir="portico-server-linux-${arch}"
            mkdir -p "dist/${dir}"
            CGO_ENABLED=0 GOOS=linux GOARCH=${arch} go build -trimpath -buildvcs=false -ldflags="-s -w" \
              -o "dist/${dir}/portico-server" ./cmd/portico-server
            cp build/linux/systemd/portico-server.service LICENSE "dist/${dir}/"
            tar -C dist -czf "dist/${dir}.tar.gz" "${dir}"
          done
          ls -lh dist/*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: dist/*.tar.gz

