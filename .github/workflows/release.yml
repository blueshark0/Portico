name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    # 在最低支持的系统上构建，产物依赖的 glibc 版本才不会高于 Ubuntu 22.04
    runs-on: ubuntu-22.04
    env:
      ARCH: amd64
      # nfpm.yaml 通过环境变量读取架构和维护者
      GOARCH: amd64
      GIT_COMMITTER_NAME: blueshark0
      GIT_COMMITTER_EMAIL: blueshark0@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails
        run: go install -tags gtk3 github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      # nfpm.yaml 里的版本号是固定值，打包前改成当前 tag，否则 deb/rpm 无法正常升级
      - name: Set package version
        run: |
          sed -i "s/^version: .*/version: \"${GITHUB_REF_NAME#v}\"/" build/linux/nfpm/nfpm.yaml

      # AppImage 打包要从 GitHub 下载工具，偶尔会返回 504，失败后等一分钟重试
      - name: Build Linux packages
        run: |
          for attempt in 1 2 3; do
            wails3 task package && exit 0
            echo "Packaging attempt $attempt failed"
            sleep 60
          done
          exit 1

      - name: Rename packages
        run: |
          cd bin
          mv ./*.AppImage portico-linux-amd64.AppImage
          mv Portico.deb portico-linux-amd64.deb
          mv Portico.rpm portico-linux-amd64.rpm
          mv Portico.pkg.tar.zst portico-linux-amd64.pkg.tar.zst

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: bin/portico-linux-amd64.*

