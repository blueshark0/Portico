name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-24.04
    env:
      ARCH: amd64
      # nfpm.yaml 通过环境变量读取架构和维护者
      GOARCH: amd64
      GIT_COMMITTER_NAME: blueshark0
      GIT_COMMITTER_EMAIL: blueshark0@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      # nfpm.yaml 里的版本号是固定值，打包前改成当前 tag，否则 deb/rpm 无法正常升级
      - name: Set package version
        run: |
          sed -i "s/^version: .*/version: \"${GITHUB_REF_NAME#v}\"/" build/linux/nfpm/nfpm.yaml

      - name: Build Linux packages
        run: wails3 task package

      - name: Rename packages
        run: |
          cd bin
          mv ./*.AppImage portico-linux-amd64.AppImage
          mv Portico.deb portico-linux-amd64.deb
          mv Portico.rpm portico-linux-amd64.rpm
          mv Portico.pkg.tar.zst portico-linux-amd64.pkg.tar.zst

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: bin/portico-linux-amd64.*

