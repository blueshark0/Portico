name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  go-test:
    runs-on: ubuntu-latest
    needs: frontend-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: Prepare apt cache directory
        run: sudo chown -R runner:runner /var/cache/apt/archives

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-gtk4-webkit6-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-gtk4-webkit6-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      # frontend/embed.go 通过 //go:embed all:dist 嵌入前端产物（portico-server 托管），vet/test 前必须就位
      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race -count=1 ./...

      # portico-server 承诺纯 Go（无 cgo），可直接交叉编译到各服务器平台。
      - name: Build portico-server without cgo
        run: |
          CGO_ENABLED=0 go build -o /dev/null ./cmd/portico-server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/portico-server
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/portico-server

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # bindings 不入库（.gitignore），构建前必须重新生成
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: true

      - name: Prepare apt cache directory
        run: sudo chown -R runner:runner /var/cache/apt/archives

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: apt-${{ runner.os }}-gtk4-webkit6-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-gtk4-webkit6-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Generate bindings
        working-directory: .
        run: wails3 task common:generate:bindings

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend regression tests
        run: pnpm run test

      - name: Type-check and build
        run: pnpm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1
